step_type: GraphFeatureProcessing
node_type: internal
registry:
  sagemaker_step_type: Processing
  requires: none
  description: Turn per-seed subgraph pickles + labelled seeds into the GraphStorm GConstruct input (per-type node/edge parquets, reverse edges, node-ID-keyed masks, gconstruct_config.json). BYO GraphStorm image.
patterns:
  direct_input_keys: [SUBGRAPHS, SEEDS]
compute:
  kind: byo_container
  image_uri_field: image_uri
  container_entrypoint: [bash, /opt/ml/processing/input/code/entrypoint.sh]
contract:
  entry_point: graph_feature_processing.py
  inputs:
    SUBGRAPHS:
      path: /opt/ml/processing/input/subgraphs
      required: true
    SEEDS:
      path: /opt/ml/processing/input/seeds
      required: true
  outputs:
    graph_data:
      path: /opt/ml/processing/output
  arguments: {}
  job_arguments:
  - flag: --config
    source: config_yaml_container_path
  - flag: --num-chunks
    source: num_chunks
  env_vars:
    required: []
    optional:
      SUBGRAPH_SOURCE: nebula
      QUERY_TYPE: relation
      REVERSE_EDGE: 'true'
      TRAIN_FRAC: '0.8'
      VAL_FRAC: '0.1'
      CHUNK_SIZE: '50000'
      BERT_MODEL: bert-base-uncased
      MAX_SEQ_LENGTH: '16'
      SKIP_SANITY_CHECK: 'false'
  framework_requirements:
    polars: '>=0.20.0'
    pandas: '>=1.3.0'
    numpy: '>=1.21.0'
    pyyaml: '>=6.0'
    tqdm: '>=4.65.0'
  description: 'Graph feature-processing orchestrator (ports Nexus run_feature_processing.py):
    runs prepare_graphstorm_format.py (type-aware node/edge feature extraction, reverse-edge
    generation, node-ID-keyed multi-task masks, gconstruct_config.json) then custom features
    then sanity_check.py, all from the BYO GraphStorm image''s bundled code. Output is the
    GraphStorm GConstruct input tree.

    '
spec:
  dependencies:
    SUBGRAPHS:
      type: processing_output
      required: true
      compatible_sources: [GraphSubgraphExtraction]
      semantic_keywords: [subgraph, pickle, graph, nebula, neptune, traversal]
    SEEDS:
      type: processing_output
      required: true
      compatible_sources: [GraphSubgraphExtraction, CradleDataLoading]
      semantic_keywords: [seed, label, target, order_id, node_id, id_col]
  outputs:
    graph_data:
      type: processing_output
      property_path: properties.ProcessingOutputConfig.Outputs['graph_data'].S3Output.S3Uri
      semantic_keywords: [graph, nodes, edges, gconstruct, gconstruct_config, parquet, dgl_input, heterograph]
      aliases:
      - gconstruct_input
      - graph_input
      - graph_data
      - graphstorm_input
      - processed_graph
      data_type: S3Uri
