step_type: TabularLookupModelBuilding
node_type: internal
registry:
  sagemaker_step_type: Processing
  description: Build a non-parametric lookup/membership model from a tabular dataset (the dataset IS the model)
patterns:
  step_assembly: step_args
compute:
  kind: framework                    # FrameworkProcessor(estimator_cls=SKLearn) — source_dir support
  sdk_class: SKLearn
  framework_version_field: processing_framework_version
contract:
  entry_point: tabular_lookup_model_building.py
  source_dir: true
  inputs:
    input_data:
      path: /opt/ml/processing/input/data
      required: true
  outputs:
    model_output:
      path: /opt/ml/processing/output/model
  arguments: {}
  env_vars:
    required: []
    optional:
      MODEL_KIND: lookup
      KEY_COLUMNS: '[]'
      VALUE_COLUMNS: '[]'
      DEDUP: 'true'
      SHARD_COUNT: '1'
      INFERENCE_FIELDS: '[]'
  framework_requirements:
    pandas: '>=1.3.0'
    numpy: '>=1.21.0'
    pyarrow: '>=8.0.0'
  description: 'Non-parametric lookup/model-building step: reads a tabular dataset
    (parquet) from an upstream data-loading step, turns the dataset itself into the
    model (a key->values lookup map when MODEL_KIND=lookup, or a de-duplicated
    key set when MODEL_KIND=set_membership), and packages it into model.tar.gz for
    downstream MIMS Package + Payload. No training, no learned parameters. The
    per-project inference handler is bundled separately by the Package step
    (inference_scripts_input) and is NOT generated by this script.

    '
spec:
  dependencies:
    input_data:
      type: processing_output
      required: true
      compatible_sources:
      - CradleDataLoading
      - TabularPreprocessing
      - ProcessingStep
      semantic_keywords:
      - data
      - input
      - dataset
      - source
      - raw
      - tabular
      - addresses
      - training
      data_type: S3Uri
  outputs:
    model_output:
      type: model_artifacts
      property_path: properties.ProcessingOutputConfig.Outputs['model_output'].S3Output.S3Uri
      semantic_keywords:
      - model
      - artifacts
      - model_data
      - lookup
      aliases:
      - ModelOutputPath
      - ModelArtifacts
      - model_data
      - model_input
      - output_path
      data_type: S3Uri
